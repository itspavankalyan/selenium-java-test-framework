# =========================================================================
# Central framework configuration.
# Every value here can be overridden at runtime with -D<key>=<value>,
# e.g. `mvn test -Dbrowser=firefox -Dheadless=false`, so CI and local
# runs share one file instead of hand-editing config for each environment.
# =========================================================================

# ---- UI layer (saucedemo.com) ----
ui.baseUrl=https://www.saucedemo.com
browser=chrome
headless=true
# explicit.wait.seconds is deliberately generous: shared CI runners (GitHub
# Actions) are noisier than a local dev machine, and a wait that's tight
# enough to be "fast" locally can flake under CI load even when the app
# itself has genuinely finished rendering, just a little later than usual.
implicit.wait.seconds=5
explicit.wait.seconds=15

# ---- API layer (restful-booker practice API) ----
api.baseUrl=https://restful-booker.herokuapp.com
api.auth.username=admin
api.auth.password=password123

# ---- DB validation layer (local H2 file DB acting as test oracle) ----
db.url=jdbc:h2:file:./target/testdb/bookingaudit;AUTO_SERVER=TRUE
db.driver=org.h2.Driver
db.username=sa
db.password=
